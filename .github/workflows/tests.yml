name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 20 reached end of life in April 2026. AMO rejects add-ons built on
        # unsupported runtimes, so it is not enough to stop declaring it — we must stop
        # testing on it too, or CI green means nothing for what we ship.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run crypto tests
        run: node --import tsx --test tests/crypto/*.test.ts

      # Mirrors the browser-mocked group in tests/run.sh. It had drifted: several suites
      # that run locally were never gated here, including the post-quantum handlers.
      - name: Run module tests
        run: node --import tsx --import ./tests/helpers/register-mocks.ts --test tests/vault.test.ts tests/permissions.test.ts tests/domain-handlers.test.ts tests/accounts.test.ts tests/signer.test.ts tests/security-hardening.test.ts tests/communication.test.ts tests/delete-recreate.test.ts tests/wallet/permissions.test.ts tests/wallet/background-handlers.test.ts tests/vault-wallet.test.ts tests/publish-handlers.test.ts tests/pqc-handlers.test.ts
        timeout-minutes: 5

      - name: Run remaining unit tests
        run: node --import tsx --test tests/wallet/types.test.ts tests/wallet/lnbits.test.ts tests/wallet/nwc.test.ts tests/wallet/index.test.ts tests/wallet/lnbits-provision.test.ts tests/wallet/bolt11.test.ts tests/inject-webln.test.ts tests/wizardMachine.test.ts tests/openPopupForActiveTab.test.ts tests/safeUrl.test.ts tests/rpc.test.ts tests/active-tab-domain.test.ts
        timeout-minutes: 3

      - name: Run relay tests
        run: node --import tsx --import ./tests/helpers/register-mocks.ts --test tests/relay.test.ts
        timeout-minutes: 2

      - name: Build
        run: npm run build
