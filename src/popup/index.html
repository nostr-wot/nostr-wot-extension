<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nostr WoT Settings</title>
  <!--
    Critical first-paint layout. Safari Web Extension popups measure the
    document size as soon as the document loads and lock the popup window
    to that size — if the eventual layout (from the async-loaded CSS
    module) hasn't applied yet, the first open is mis-sized and only
    re-opens after CSS is cached look correct. Declaring fixed html/body
    dimensions and the root flex layout here removes that race.

    Use FIXED PIXEL dimensions only — no `max-width/max-height: 100%`.
    A Chrome action popup can render in "auto-size" mode where the content
    determines the window size; percentage constraints then resolve against
    that collapsed/content-driven viewport and shrink the popup, which only
    snaps to full size after a reflow (e.g. switching tabs). min-* locks the
    intended size in auto-size mode. (See w3c/webextensions#692.)
  -->
  <style>
    html, body {
      width: 380px;
      height: 600px;
      min-width: 380px;
      min-height: 600px;
      margin: 0;
      overflow: hidden;
    }
    body {
      padding: 8px;
      box-sizing: border-box;
      /* Opaque (not transparent): a Chrome popup with a transparent root under a
         blurred/scaled backdrop layer can skip compositing the first frame until
         a forced repaint (e.g. switching tabs), leaving the popup blank on open.
         An opaque base guarantees a painted frame. The screenshot backdrop still
         overlays this. #f8f8fc == theme --bg-html. */
      background: #f8f8fc;
    }
    #root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="main.tsx"></script>
</body>
</html>
